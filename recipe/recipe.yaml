schema_version: 1

context:
  name: pyglm
  version: "2.8.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyglm-${{ version }}.tar.gz
  sha256: d0251a4b3e009f05737222d8774a9504c79b538833872a363b4ff3e9aebfa120

build:
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - pip
        - python
        - setuptools
  host:
    - pip
    - python
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - glm
  - script:
      - pip check
      - python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python

about:
  homepage: https://github.com/Zuzu-Typ/PyGLM
  repository: https://github.com/Zuzu-Typ/PyGLM
  summary: OpenGL Mathematics library for Python
  license: Zlib
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeongseok-meta
